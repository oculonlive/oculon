# Cloudflare Worker for app.oculon.live, docs.oculon.live and mcp.oculon.live and console.oculon.live.
# Deploy: npx wrangler deploy --config edge/wrangler.toml
# Secret: npx wrangler secret put EDGE_SECRET --config edge/wrangler.toml  (same value as OCULON_EDGE_SECRET on the server)
name = "oculon-edge"
main = "worker.js"
compatibility_date = "2025-06-01"
workers_dev = false

routes = [
  { pattern = "app.oculon.live", custom_domain = true },
  { pattern = "docs.oculon.live", custom_domain = true },
  { pattern = "mcp.oculon.live", custom_domain = true },
  { pattern = "console.oculon.live", custom_domain = true },
]

[vars]
ORIGIN = "https://oculon.live"
