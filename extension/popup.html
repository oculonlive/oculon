<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Oculon Shield</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 360px; padding: 14px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    header a { color: var(--muted); font-size: 12px; }
    section { margin-bottom: 12px; }
    form { display: grid; gap: 8px; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
    .row button { flex: none; }
    .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .seg label { flex: 1; text-align: center; padding: 6px 0; cursor: pointer; font-size: 13px; color: var(--muted); }
    .seg input { display: none; }
    .seg input:checked + span { color: #000; }
    .seg label:has(input:checked) { background: var(--accent); color: #000; }
    .more { margin-top: 8px; font-size: 12px; }
    footer { border-top: 1px solid var(--line); padding-top: 10px; font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div class="brand"><img src="icons/icon-32.png" alt="">OCULON <small>SHIELD</small></div>
    <a href="options.html" target="_blank" id="opts">Settings</a>
  </header>

  <section>
    <p class="label">This site</p>
    <div class="card" id="site">
      <div class="verdict"><span class="dot"></span><span class="vt" id="site-verdict">Not checked</span><span class="score" id="site-score"></span></div>
      <div class="subject" id="site-host"></div>
      <ul class="reasons" id="site-reasons"></ul>
      <div class="more" id="site-more"></div>
    </div>
  </section>

  <section>
    <p class="label">Check anything</p>
    <form id="form" autocomplete="off">
      <div class="row">
        <input type="text" id="q" placeholder="Link, domain, wallet or token contract" spellcheck="false" maxlength="2000">
        <button type="submit" id="go">Check</button>
      </div>
      <div id="evm" class="hidden">
        <div class="row">
          <div class="seg" role="radiogroup" aria-label="Address type">
            <label><input type="radio" name="as" value="token" checked><span>Token</span></label>
            <label><input type="radio" name="as" value="wallet"><span>Wallet</span></label>
          </div>
          <select id="chain" aria-label="Chain"></select>
        </div>
      </div>
    </form>
    <div class="card hidden" id="out" style="margin-top:8px">
      <div class="verdict"><span class="dot"></span><span class="vt" id="out-verdict"></span><span class="score" id="out-score"></span></div>
      <div class="subject" id="out-subject"></div>
      <ul class="reasons" id="out-reasons"></ul>
      <div class="more" id="out-more"></div>
    </div>
  </section>

  <footer>Privacy: Oculon Shield sends only the domain, link, address or contract being checked to the Oculon API. No browsing history, no analytics, no tracking.</footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
